name: Test cpplint with lint errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a C++ file with lint errors
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cpp-errors"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cpp-errors/bad.cpp" << 'EOF'
          #include<iostream>
          using namespace std;
          int main(){
          int x=1;
          cout<<x<<endl;
          return 0;
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          level: warning
          reporter: github-check
          reviewdog_flags: '-filter-mode=nofilter'
          targets: 'tests/fixtures/cpp-errors'

      - name: Assert action ran (lint errors cause non-zero exit but action should still run)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # cpplint finding errors causes reviewdog to exit non-zero with github-check reporter
          # under the sentinel repo environment, the action may fail due to API limitations
          # Both success and failure are acceptable outcomes here
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
