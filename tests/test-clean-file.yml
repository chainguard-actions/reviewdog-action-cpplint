name: Test clean file passes with fail-level=any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: local
          reviewdog_flags: -fail-level=any
          targets: --recursive tests/fixtures/clean
      - name: Assert action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected success for a cpplint-clean file"
            exit 1
          fi
          echo "PASS"
