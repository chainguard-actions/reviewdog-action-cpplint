name: Test cpplint with violations detected
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a C++ file with cpplint violations
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/violations"
          # This file has violations: no copyright header, uses tabs, etc.
          cat > "$GITHUB_WORKSPACE/tests/fixtures/violations/bad.cpp" << 'EOF'
          #include<iostream>
          using namespace std;
          int main(){
          	cout << "hello" << endl;
          	return 0;
          }
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: local
          level: warning
          targets: '--recursive tests/fixtures/violations'
          flags: '--extensions=cpp'

      - name: Assert action ran (violations cause non-zero exit but action should complete)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # cpplint exits non-zero when violations are found, which may cause the action to fail
          # Both success and failure are acceptable outcomes here — the key is the action ran
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and completed (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
