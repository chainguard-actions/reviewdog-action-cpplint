name: Test cpplint with additional reviewdog flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a C++ file for reviewdog flags test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/rdflags"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/rdflags/main.cpp" << 'EOF'
          // Copyright 2024 Test. All rights reserved.
          #include <iostream>

          int main() {
            std::cout << "Test" << std::endl;
            return 0;
          }
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: local
          level: info
          # -tee flag makes reviewdog also print output to stdout
          reviewdog_flags: '-tee'
          targets: '--recursive tests/fixtures/rdflags'
          flags: '--extensions=cpp'

      - name: Assert action ran with reviewdog flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with reviewdog_flags (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
