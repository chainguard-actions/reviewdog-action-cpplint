name: Test violations fail with fail-level=any
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: local
          reviewdog_flags: -fail-level=any
          targets: tests/fixtures/bad/bad.cc
      - name: Assert action failed due to lint violations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure because bad.cc has cpplint violations"
            exit 1
          fi
          echo "PASS"
