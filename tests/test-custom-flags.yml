name: Test cpplint with custom filter flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a C++ file for filter testing
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/cpp-filter"
          cat > "$GITHUB_WORKSPACE/tests/fixtures/cpp-filter/sample.cpp" << 'EOF'
          // Copyright 2024 Test. All rights reserved.
          #include <iostream>

          int main() {
            std::cout << "test" << std::endl;
            return 0;
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          level: info
          reporter: github-check
          reviewdog_flags: '-filter-mode=nofilter'
          flags: '--extensions=cpp'
          filter: '-build/include_order'
          targets: 'tests/fixtures/cpp-filter'

      - name: Assert action ran with custom flags
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (either succeed or fail gracefully under sentinel repo)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom flags (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
