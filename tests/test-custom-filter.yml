name: Test cpplint with custom filter flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create C++ files for filter test
        run: |
          mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/filter"
          # A file that would normally trigger legal/copyright and whitespace warnings
          cat > "$GITHUB_WORKSPACE/tests/fixtures/filter/sample.cpp" << 'EOF'
          #include <iostream>

          int main() {
            std::cout << "Hello" << std::endl;
            return 0;
          }
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: local
          level: warning
          # Suppress legal/copyright and build/include_order checks
          filter: '-legal/copyright,-build/include_order'
          targets: '--recursive tests/fixtures/filter'
          flags: '--extensions=cpp'

      - name: Assert action ran with custom filter
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should run (success or failure based on remaining violations)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with custom filter (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
