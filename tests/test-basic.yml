name: Test basic usage with local reporter
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github_token: fake-token-for-local-reporter
          reporter: local
          level: warning
          targets: '--recursive testdata'
          flags: '--extensions=h,hpp,c,cpp,cc,cu,hh,ipp'
      - name: Assert action completed successfully
        run: |
          echo "Action completed without fatal error"
          echo "PASS"
